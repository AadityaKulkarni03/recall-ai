<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* wss://*.railway.app wss://*.up.railway.app http://localhost:* https://*.railway.app https://*.up.railway.app; media-src 'self' blob:;" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #060b18; color: #e2e8f0; padding: 16px;
      display: flex; flex-direction: column; height: 100vh;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .header h1 { font-size: 14px; font-weight: 800; letter-spacing: 0.05em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; flex-shrink: 0; }
    .dot.off { background: #64748b; }
    .dot.recording { background: #f87171; animation: pulse 1.5s infinite; }
    .status {
      font-size: 11px; color: #94a3b8; margin-bottom: 12px;
      padding: 8px 12px; background: rgba(255,255,255,0.03);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);
    }
    .server-input {
      width: 100%; padding: 8px 12px; font-size: 11px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #e2e8f0; outline: none;
      margin-bottom: 10px; font-family: monospace;
    }
    label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; display: block; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s;
    }
    #startBtn { background: #34d399; color: #060b18; }
    #startBtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #stopBtn { background: #f87171; color: #fff; display: none; }
    .stats { display: none; gap: 8px; margin-top: 10px; }
    .stat {
      flex: 1; text-align: center; padding: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
    }
    .stat .val { font-size: 16px; font-weight: 800; font-family: monospace; color: #34d399; }
    .stat .label { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
    #errorMsg {
      display: none; margin-top: 8px; padding: 8px 12px;
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px; font-size: 11px; color: #f87171;
    }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-top: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .tab {
      flex: 1; padding: 8px 0; text-align: center; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .tab.active { color: #34d399; border-bottom-color: #34d399; }
    .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; margin-top: 8px; }
    .tab-content.active { display: flex; }

    /* Transcript */
    #transcriptList {
      flex: 1; overflow-y: auto; padding: 8px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; font-size: 12px; line-height: 1.6;
    }
    .transcript-line { margin-bottom: 6px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .transcript-line .speaker { color: #34d399; font-weight: 700; font-size: 10px; margin-right: 6px; text-transform: uppercase; }
    .empty-state { text-align: center; padding: 20px 0; color: #64748b; font-size: 11px; }

    /* Query */
    .query-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .query-input {
      flex: 1; padding: 8px 12px; font-size: 12px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #e2e8f0; outline: none;
    }
    .query-input:focus { border-color: rgba(56,189,248,0.3); }
    .search-btn {
      width: auto; padding: 8px 14px; background: #38bdf8; color: #060b18;
      border-radius: 8px; font-size: 10px;
    }
    .search-btn:disabled { opacity: 0.3; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .toggle {
      width: 36px; height: 20px; border-radius: 10px; cursor: pointer;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
      position: relative; transition: all 0.3s;
    }
    .toggle.on { background: #34d399; border-color: #34d399; }
    .toggle .knob {
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      position: absolute; top: 2px; left: 2px; transition: all 0.3s;
    }
    .toggle.on .knob { left: 18px; }
    .toggle-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; }
    #queryResults {
      flex: 1; overflow-y: auto; padding: 8px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; font-size: 12px; line-height: 1.6;
    }
    .ai-answer {
      padding: 10px; margin-bottom: 8px;
      background: rgba(52,211,153,0.05); border: 1px solid rgba(52,211,153,0.1);
      border-radius: 8px; font-size: 12px; line-height: 1.7;
    }
    .ai-answer .ai-label { font-size: 9px; color: #34d399; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .passage {
      padding: 8px; margin-bottom: 6px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
      border-radius: 6px;
    }
    .passage .meta { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .passage .score { font-size: 10px; font-weight: 800; font-family: monospace; color: #34d399; }
    .passage .speaker-ts { font-size: 9px; color: #64748b; }
    .latency-pill {
      display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px;
      font-family: monospace; font-weight: 700; margin-right: 4px; margin-bottom: 6px;
    }
    .latency-pill.retrieval { background: rgba(52,211,153,0.1); color: #34d399; }
    .latency-pill.gen { background: rgba(56,189,248,0.1); color: #38bdf8; }
    .streaming-cursor { display: inline-block; width: 6px; height: 14px; background: rgba(52,211,153,0.6); animation: pulse 1s infinite; border-radius: 2px; margin-left: 2px; vertical-align: text-bottom; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>

<body>
  <div class="header">
    <div class="dot" id="statusDot"></div>
    <h1>Recall AI</h1>
  </div>
  <div class="status" id="statusText">Ready — share a meeting tab to capture its audio</div>
  <label>Backend URL</label>
  <input class="server-input" id="serverUrl" value="ws://localhost:8000/ws/audio"
    placeholder="ws://localhost:8000/ws/audio or wss://your-app.railway.app/ws/audio" />
  <button id="startBtn">● Start Capture</button>
  <button id="stopBtn">■ Stop Capture</button>
  <div id="errorMsg"></div>
  <div class="stats" id="stats">
    <div class="stat"><div class="val" id="utterances">0</div><div class="label">Utterances</div></div>
    <div class="stat"><div class="val" id="duration">0:00</div><div class="label">Duration</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="transcript">Transcript</div>
    <div class="tab" data-tab="query">Query</div>
  </div>

  <!-- Transcript Tab -->
  <div class="tab-content active" id="tab-transcript">
    <div id="transcriptList">
      <div class="empty-state">Transcripts will appear here...</div>
    </div>
  </div>

  <!-- Query Tab -->
  <div class="tab-content" id="tab-query">
    <div class="query-input-row">
      <input class="query-input" id="queryInput" placeholder="Ask about the conversation..." />
      <button class="search-btn" id="queryBtn">Ask</button>
    </div>
    <div class="toggle-row">
      <div class="toggle" id="llmToggle"><div class="knob"></div></div>
      <span class="toggle-label">AI Summary</span>
    </div>
    <div id="queryResults">
      <div class="empty-state">Ask a question to search the conversation</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
